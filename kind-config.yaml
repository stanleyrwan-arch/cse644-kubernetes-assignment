kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30088
        hostPort: 30088
        protocol: TCP
      - containerPort: 30082
        hostPort: 8082
        protocol: TCP
